[project]
name = "datathon-kit"
version = "0.1.0"
description = "Datathon '26 (ForteBank case) solution repo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "joblib>=1.3",
    "shap>=0.44",
    "optuna>=5.0.0",
    "statsmodels>=0.15.0",
    "python-pptx>=1.0.2",
    "opencv-python-headless>=5.0.0.93",
    "fastapi>=0.143.3",
    "ai-edge-litert==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# This is an application, not a library: uv manages the environment but does not build/install it.
package = false
